  <style>
    /* Styles spécifiques à la page Merci */
    .merci-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 28px 60px;
      background: var(--gris-bg);
    }
    .merci-card {
      background: #fff;
      border: 1px solid var(--gris-bord);
      border-radius: 8px;
      padding: 56px 48px;
      text-align: center;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(37,99,235,0.07);
    }
    .merci-icon {
      width: 72px; height: 72px;
      background: var(--bleu-clair);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 28px;
    }
    .merci-card h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--noir);
      margin-bottom: 14px;
      letter-spacing: -0.02em;
    }
    .merci-card p {
      color: var(--texte-doux);
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 36px;
    }
    .merci-actions {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }
    .btn-appel {
      display: inline-flex; align-items: center; gap: 9px;
      background: var(--bleu-vif); color: #fff;
      padding: 14px 32px; border-radius: 4px;
      font-size: 1rem; font-weight: 700;
      transition: background 0.2s;
      width: 100%;
      justify-content: center;
    }
    .btn-appel:hover { background: var(--bleu); }
    .btn-retour {
      display: inline-flex; align-items: center; gap: 7px;
      color: var(--texte-doux);
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    .btn-retour:hover { color: var(--bleu-vif); }

    @media (max-width: 768px) {
      .merci-card { padding: 36px 24px; }
    }
  </style>
